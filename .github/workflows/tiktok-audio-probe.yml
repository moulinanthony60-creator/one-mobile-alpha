name: Diagnostic audio TikTok
on:
  push:
    branches: [codex/tiktok-diagnostic-audio]
    paths: ['scripts/tiktok-audio-probe.py', '.github/workflows/tiktok-audio-probe.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r scripts/tiktok-health-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/tiktok-audio-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-audio
          path: audio-report/
          retention-days: 7
