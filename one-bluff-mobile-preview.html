<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aperçu ONE Bluff — capture de référence</title>
<link rel="stylesheet" href="../work/one-source/ui/party-game.css?v=014115">
<link rel="stylesheet" href="../work/one-source/ui/party-bluff.css?v=014115">
<link rel="stylesheet" href="../work/one-source/ui/game-tables.css?v=014115">
<link rel="stylesheet" href="../work/one-source/ui/bluff-table-structure.css?v=014115">
<style>
html,body{margin:0;min-height:100%;background:#080710;color:#fff;font-family:system-ui,sans-serif}body{width:min(100vw,337px);margin:auto}#onePartyGame.isBluff{border-radius:0;min-height:100dvh}.oneGameBody{min-height:100dvh!important}.bf-player .gt-portrait{display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#cfb28c,#5c3e39 35%,#171521 75%);overflow:hidden}.gt-portrait .cg-avatar{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;font-size:28px;font-weight:800;color:#fff;background:linear-gradient(145deg,#814ca7,#172039)}.bf-player:nth-of-type(2) .gt-portrait .cg-avatar{background:linear-gradient(145deg,#b77a68,#34233c)}.bf-player:nth-of-type(3) .gt-portrait .cg-avatar{background:linear-gradient(145deg,#73503c,#14192a)}.bf-own .gt-portrait .cg-avatar{background:linear-gradient(145deg,#7955b9,#192747)}.bluff-controls .bluff-actions button{text-transform:uppercase}.bluff-chat-dock #onePartyChat{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:6px;align-items:center;height:34px;padding:2px 6px}.bluff-chat-dock textarea{width:100%;height:26px;resize:none;border-radius:14px;border:1px solid #514469;background:#11101a;color:#fff;padding:5px 9px;font:10px system-ui}.bluff-chat-dock button{width:28px;height:28px;min-height:28px;padding:0!important;border-radius:50%!important;color:#ffd35a!important;background:#191522!important}
</style>
</head>
<body>
<section id="onePartyGame" class="isBluff"><div class="oneGameBody">
<nav class="cg-topbar">
 <button class="bluff-salon-button">☰　Salon : Les Amis</button>
 <div class="bluff-media-tools"><button class="bluff-media-toggle" aria-label="Micro">🎙</button><button class="bluff-media-toggle" aria-label="Caméra">▣</button></div>
 <details class="cg-menu"><summary>⋮</summary></details>
</nav>
<div class="bluff-scene bf-premium" aria-label="Table ONE Bluff">
 <article class="bf-player" style="--seat-x:50%;--seat-y:24%;--seat-scale:.9"><div class="gt-portrait"><span class="cg-avatar">L</span></div><small class="gt-mic">🎙</small><b>Léa</b><small class="bf-count">4</small><div class="bf-backs"><i></i><i></i><i></i><i></i></div></article>
 <article class="bf-player" style="--seat-x:17%;--seat-y:35%;--seat-scale:.88"><div class="gt-portrait"><span class="cg-avatar">T</span></div><small class="gt-mic">🎙</small><b>Tom</b><small class="bf-count">5</small><div class="bf-backs"><i></i><i></i><i></i><i></i><i></i></div></article>
 <article class="bf-player" style="--seat-x:83%;--seat-y:35%;--seat-scale:.88"><div class="gt-portrait"><span class="cg-avatar">C</span></div><small class="gt-mic">🎙</small><b>Chloé</b><small class="bf-count">3</small><div class="bf-backs"><i></i><i></i><i></i></div></article>
 <div class="bluff-round">12</div><div class="bluff-live-status">À toi de jouer</div>
 <div class="bluff-target"><small>Léa annonce :</small><strong>2 × Roi</strong></div><div class="bf-table-mark" aria-hidden="true">ONE</div>
 <div class="bf-center"><div class="bf-deck" hidden>✦<br>ONE</div><div class="bf-played-cards"></div><div class="bf-pending"><i class="bf-card-back">ONE</i><i class="bf-card-back">ONE</i></div></div>
 <div class="bluff-hand" aria-label="Tes cartes"><button class="bluff-card" style="--fan:-18deg;--rise:8px"><small>A</small><strong>♠</strong><span>A</span></button><button class="bluff-card" style="--fan:-9deg;--rise:4px"><small>10</small><strong>♦</strong><span>10</span></button><button class="bluff-card" style="--fan:0deg;--rise:0px"><small>10</small><strong>♣</strong><span>10</span></button><button class="bluff-card" style="--fan:9deg;--rise:4px"><small>Q</small><strong>♥</strong><span>Q</span></button><button class="bluff-card" style="--fan:18deg;--rise:8px"><small>K</small><strong>♠</strong><span>K</span></button></div>
 <article class="bf-player bf-own"><div class="gt-portrait"><span class="cg-avatar">V</span></div><small class="gt-mic">🎙</small><b>Vous</b></article>
 <section class="bluff-controls"><h3>À toi de jouer</h3><details hidden></details><div class="bluff-actions"><button class="bluff-play">Jouer cette combinaison</button><button class="bluff-accuse">Accuser de bluff</button></div></section>
</div>
<div class="bluff-chat-dock"><div id="onePartyChat"><textarea placeholder="Écris un message…"></textarea><button aria-label="Envoyer">➤</button></div></div>
</div></section>
</body>
</html>
